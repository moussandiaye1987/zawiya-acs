# =====================================================================
# Configuration Netlify — Zawiya Cheikh Ibrahim Niasse (ACS)
# Le site est déployé depuis GitHub : Netlify publie le dossier `public`
# et transforme `netlify/functions` en points d'accès /api/*.
# =====================================================================

[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Les secrets sont limités au contexte Production dans Netlify : les
# aperçus de pull request n'ont donc ni base ni service d'e-mail, et le
# code le gère seul — les formulaires répondent « momentanément
# indisponible » et le tableau de bord affiche « en cours de
# consolidation ». Un aperçu ne peut pas écrire dans la vraie base.

# --- Cache : les ressources ne changent jamais, la page oui ---
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# --- En-têtes de sécurité ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Le site n'est servi qu'en HTTPS : on demande au navigateur de ne
    # plus jamais tenter la version en clair, y compris à la première
    # frappe dans la barre d'adresse après une première visite.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Tout vient du site lui-même : plus aucune police, image ou script
    # d'origine tierce depuis le rapatriement des polices. « unsafe-inline »
    # reste nécessaire tant que le script et la feuille de style sont
    # écrits dans la page ; la règle bloque néanmoins tout chargement
    # extérieur, ce qui est la protection recherchée.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"
